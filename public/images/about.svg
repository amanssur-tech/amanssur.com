<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 420 480"
  width="420"
  height="480"
  fill="none"
  role="img"
  aria-labelledby="about-title about-desc"
  class="about-illustration"
>
  <title id="about-title">Connected Systems</title>
  <desc id="about-desc">
    Connecting business requirements and technical
    consulting with engineering, integration and automation.
  </desc>

  <style>
    .about-illustration {
      --accent: var(--about-accent, #6366f1);
      --ink: var(--about-ink, #334155);
      font-family: var(--about-font, system-ui, sans-serif);
    }

    .about-illustration .node {
      fill: var(--accent);
      fill-opacity: 0.05;
      stroke: var(--accent);
      stroke-opacity: 0.4;
      stroke-width: 1;
    }

    .about-illustration .connection {
      stroke: var(--accent);
      stroke-width: 1.5;
      stroke-opacity: 0.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .about-illustration .symbol {
      stroke: var(--accent);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .about-illustration .label {
      fill: var(--ink);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-anchor: middle;
    }

    .about-illustration .terminal,
    .about-illustration .packet {
      fill: var(--accent);
    }

    @media (prefers-color-scheme: dark) {
      .about-illustration {
        --accent: var(--about-accent, #818cf8);
        --ink: var(--about-ink, #e2e8f0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .about-illustration .packet {
        display: none;
      }
    }
  </style>

  <defs>
    <!-- Subtle background grid -->
    <pattern
      id="about-grid"
      width="20"
      height="20"
      patternUnits="userSpaceOnUse"
    >
      <circle
        cx="2"
        cy="2"
        r="0.9"
        fill="var(--ink)"
        opacity="0.15"
      />
    </pattern>

    <radialGradient id="about-fade">
      <stop offset="0%" stop-color="white" />
      <stop offset="65%" stop-color="white" />
      <stop offset="100%" stop-color="black" />
    </radialGradient>

    <mask id="about-grid-mask">
      <rect
        width="420"
        height="480"
        fill="url(#about-fade)"
      />
    </mask>

    <linearGradient
      id="about-core"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >
      <stop
        offset="0%"
        stop-color="var(--accent)"
        stop-opacity="0.15"
      />
      <stop
        offset="100%"
        stop-color="var(--accent)"
        stop-opacity="0.03"
      />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect
    width="420"
    height="480"
    fill="url(#about-grid)"
    mask="url(#about-grid-mask)"
  />

  <!-- Engineering orbital rings -->
  <g stroke="var(--ink)" opacity="0.12">
    <circle
      cx="210"
      cy="236"
      r="103"
      stroke-dasharray="3 7"
    />
    <circle cx="210" cy="236" r="124" />
  </g>

  <!-- Connection paths -->
  <g class="connection">

    <!-- Requirements to engineering -->
    <path
      id="about-path-requirements"
      d="M100 108
         V124 Q100 136 112 136
         H162 Q174 136 174 148
         V166"
    />

    <!-- Consulting to engineering -->
    <path
      id="about-path-consulting"
      d="M320 108
         V124 Q320 136 308 136
         H258 Q246 136 246 148
         V166"
    />

    <!-- Engineering to integration -->
    <path
      id="about-path-integration"
      d="M174 306
         V324 Q174 336 162 336
         H112 Q100 336 100 348
         V364"
    />

    <!-- Engineering to automation -->
    <path
      id="about-path-automation"
      d="M246 306
         V324 Q246 336 258 336
         H308 Q320 336 320 348
         V364"
    />
  </g>

  <!-- Business requirements: top left -->
  <g transform="translate(30 36)">
    <rect
      class="node"
      width="140"
      height="72"
      rx="12"
    />

    <g class="symbol" transform="translate(60 14)">
      <rect width="20" height="25" rx="3" />
      <path d="M5 7 H15 M5 12 H15 M5 17 H11" />
    </g>

    <text class="label" x="70" y="56">
      REQUIREMENTS
    </text>
  </g>

  <!-- Technical consulting: top right -->
  <g transform="translate(250 36)">
    <rect
      class="node"
      width="140"
      height="72"
      rx="12"
    />

    <g class="symbol" transform="translate(57 14)">
      <rect width="26" height="18" rx="4" />
      <path d="M7 18 V23 L13 18" />
      <path d="M6 9 H7 M12 9 H13 M18 9 H19" />
    </g>

    <text class="label" x="70" y="56">
      CONSULTING
    </text>
  </g>

  <!-- Systems integration: bottom left -->
  <g transform="translate(30 364)">
    <rect
      class="node"
      width="140"
      height="72"
      rx="12"
    />

    <g class="symbol" transform="translate(53 15)">
      <rect width="12" height="12" rx="3" />
      <rect
        x="22"
        y="12"
        width="12"
        height="12"
        rx="3"
      />
      <path d="M12 6 H28 V12 M22 18 H6 V12" />
    </g>

    <text class="label" x="70" y="56">
      INTEGRATION
    </text>
  </g>

  <!-- Workflow automation: bottom right -->
  <g transform="translate(250 364)">
    <rect
      class="node"
      width="140"
      height="72"
      rx="12"
    />

    <g class="symbol" transform="translate(60 11)">
      <path d="M12 0 L0 16 H10 L7 28 L21 10 H10 Z" />
    </g>

    <text class="label" x="70" y="56">
      AUTOMATION
    </text>
  </g>

  <!-- Central engineering module -->
  <g>
    <rect
      x="140"
      y="166"
      width="140"
      height="140"
      rx="24"
      fill="url(#about-core)"
      stroke="var(--accent)"
      stroke-width="1.5"
    />

    <rect
      x="152"
      y="178"
      width="116"
      height="116"
      rx="17"
      stroke="var(--accent)"
      stroke-opacity="0.24"
    />

    <!-- Layered architecture symbol -->
    <g class="symbol" style="stroke-width: 2.4">
      <path
        d="M210 193 L237 208 L210 223 L183 208 Z"
        fill="var(--accent)"
        fill-opacity="0.16"
      />
      <path d="M183 220 L210 235 L237 220" />
      <path d="M183 232 L210 247 L237 232" />
    </g>

    <text
      x="210"
      y="270"
      fill="var(--ink)"
      font-size="12"
      font-weight="600"
      letter-spacing="1.4"
      text-anchor="middle"
    >
      ENGINEERING
    </text>
  </g>

  <!-- Connection terminals -->
  <g class="terminal">

    <!-- Top nodes -->
    <circle cx="100" cy="108" r="3" />
    <circle cx="320" cy="108" r="3" />

    <!-- Engineering inputs -->
    <circle cx="174" cy="166" r="3" />
    <circle cx="246" cy="166" r="3" />

    <!-- Engineering outputs -->
    <circle cx="174" cy="306" r="3" />
    <circle cx="246" cy="306" r="3" />

    <!-- Bottom nodes -->
    <circle cx="100" cy="364" r="3" />
    <circle cx="320" cy="364" r="3" />
  </g>

  <!-- Animated data packets -->
  <g class="packet">
    <circle r="3.5">
      <animateMotion
        dur="3s"
        begin="0s"
        repeatCount="indefinite"
      >
        <mpath href="#about-path-requirements" />
      </animateMotion>
    </circle>

    <circle r="3.5">
      <animateMotion
        dur="3s"
        begin="-1.5s"
        repeatCount="indefinite"
      >
        <mpath href="#about-path-consulting" />
      </animateMotion>
    </circle>

    <circle r="3.5">
      <animateMotion
        dur="3s"
        begin="-0.75s"
        repeatCount="indefinite"
      >
        <mpath href="#about-path-integration" />
      </animateMotion>
    </circle>

    <circle r="3.5">
      <animateMotion
        dur="3s"
        begin="-2.25s"
        repeatCount="indefinite"
      >
        <mpath href="#about-path-automation" />
      </animateMotion>
    </circle>
  </g>

</svg>
